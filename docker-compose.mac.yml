services:
  ros2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lunabotics_ros2
    stdin_open: true
    tty: true
    privileged: true          # simplifies USB/serial device access (if supported by Mac drivers)
    network_mode: bridge      # required on macOS to allow the container to route traffic to XQuartz
    environment:
      - DISPLAY=host.docker.internal:0   # route X11 windows through the macOS host network
      - QT_X11_NO_MITSHM=1               # prevents shared memory errors in Qt
      - LIBGL_ALWAYS_INDIRECT=1          # forces indirect rendering needed by XQuartz
      - ROS_DOMAIN_ID=0
    volumes:
      - .:/workspace
    working_dir: /workspace
    command: /bin/bash

